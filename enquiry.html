<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Title and Description -->
    <title>Product Enquiry | Gogas Stationery Ladysmith</title>
    <meta name="description" content="Enquire about our textbooks, stationery, printing services, or volunteering opportunities at Gogas Stationery in Ladysmith.">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Gogas Stationery</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="#" id="cart-link" onclick="openCart()">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>
    <hr>
</header>

<main>
    <div class="home-intro">
        <h2>Product & Service Enquiry</h2>
        <p>Have a question about our stock or services?</p> 
        <p>Fill in the form below and we will get back to you as soon as possible.</p>
    </div>

    <!-- The Form Starts Here -->
    <form id="enquiryForm" novalidate>
        
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number (optional)">
        
        <label for="enquiryType">What are you enquiring about?</label>
        <select id="enquiryType" name="enquiryType">
            <option value="textbooks">Textbooks & Study Guides</option>
            <option value="stationery">Stationery Supplies</option>
            <option value="printing">Printing & Photocopying</option>
            <option value="machines">Office equipments</option>
        </select>

        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us what you need..." required></textarea>

        <!-- Error message container for JavaScript validation -->
        <p id="error-message" style="color: red; font-weight: bold;"></p>
        
        <button type="submit" class="learn-btn">Send Enquiry</button>
    </form>

</main>

<footer>
    <p>2026 Gogas Stationery. All rights reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
